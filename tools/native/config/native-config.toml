# Dark and Gate native plugin runtime config.
# Lives at:
#   %LOCALAPPDATA%\Larian Studios\Baldur's Gate 3\Script Extender\
#   DarkAndGate\native-config.toml
#
# Lua owns the race -> eye_height lookup (data/camera.lua) and
# rewrites eye_height here on SessionLoaded. The DLL only reads it.

[dag.camera]
enabled           = false
recommit_vt58     = true
eye_height        = 1.65   # metres, Y-up; Lua overrides per character

[dag.mouselook]
enabled            = false
sensitivity_yaw    = 0.12
sensitivity_pitch  = 0.12
invert_pitch       = false
pause_in_ui        = true
