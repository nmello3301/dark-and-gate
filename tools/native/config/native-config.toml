# Dark and Gate native plugin runtime config.
# Lives at:
#   %LOCALAPPDATA%\Larian Studios\Baldur's Gate 3\Script Extender\
#   DarkAndGate\native-config.toml
#
# The DLL polls this file every ~1s and reloads if the mtime changes
# (same pattern as Native Camera Tweaks). Lua also writes a few keys
# via !dag_set_eye and the dag_* console commands.
#
# Every feature has its own switch, OFF by default. Flip one at a time.
# A crash or bad behaviour must be attributable to one switch.
#
# Phase 0 (2026-10-08): all camera overrides parked. NCT alone owns the
# baseline camera. This file sets every parked switch to false
# explicitly so a stale key doesn't silently re-enable broken writes.

# ---------------------------------------------------------------------
# Camera position pin: Phase 0 state = all overrides off, nothing written.
# NCT provides the baseline (zoom, FOV, offset, pitch unlock).
# ---------------------------------------------------------------------
[dag.camera]
enabled              = false
recommit_vt58        = false
eye_height           = 1.65   # metres; used by Phase 3 head anchor
debug_lift_m         = 0.0    # if >0, used in place of eye_height for A/B
head_bone            = false  # pin to head bone (needs bone-read spike)
hide_head            = false  # Spike11 RenderPasses zero (Lua-side)
vt58_override        = false  # parked: vt[0x58] eye+target substitution
instant_follow       = false  # parked: writes CameraDefinition damp fields
legacy_y_write       = false  # parked: wrote to currentZoomB, not cam Y
legacy_forward_write = false  # parked: forward offsets off by one float

# ---------------------------------------------------------------------
# Mouselook: SDL relative-mouse delta -> yaw/pitch -> cam forward vector.
# Phase 0 state = off. Re-enabled with a correct forward offset in a
# later phase.
# ---------------------------------------------------------------------
[dag.mouselook]
enabled            = false
sensitivity_yaw    = 0.12
sensitivity_pitch  = 0.12
invert_pitch       = false
pause_in_ui        = true
character_facing   = false  # DLL writes yaw to file; Lua rotates char

# ---------------------------------------------------------------------
# Animation speed + hit-stop. STUB in M1a.
# ---------------------------------------------------------------------
[dag.anim]
enabled      = false
hit_stop     = false
hit_stop_ms  = 100

# ---------------------------------------------------------------------
# Bone-position reads. STUB.
# ---------------------------------------------------------------------
[dag.bone]
enabled = false

# ---------------------------------------------------------------------
# Raycast with hit normal. Native not needed — Lua works.
# ---------------------------------------------------------------------
[dag.raycast]
enabled = false
